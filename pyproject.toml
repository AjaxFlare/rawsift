[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rawsift"
version = "0.2.0"
description = "Bracket-aware, non-destructive RAW photo culling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AjaxFlare" }]
keywords = ["photography", "raw", "culling", "focus-stacking", "hdr", "chatgpt-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]
app = [
  "fastapi>=0.116",
  "openai>=1.99",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.35",
]
dev = [
  "httpx>=0.28",
]

[project.scripts]
rawsift = "rawsift.cli:main"
raw-photo-culler = "rawsift.cli:deprecated_main"
rawsift-app = "rawsift.app.launcher:main"

[project.urls]
Homepage = "https://github.com/AjaxFlare/rawsift"
Repository = "https://github.com/AjaxFlare/rawsift"
Issues = "https://github.com/AjaxFlare/rawsift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rawsift = ["web/dist/*", "web/dist/assets/*"]
