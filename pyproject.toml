[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raw-photo-culler"
version = "0.1.0"
description = "Non-destructive RAW photo culling with exposure/focus bracket detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AjaxFlare" }]
keywords = ["photography", "raw", "culling", "focus-stacking", "hdr", "chatgpt-skill"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
]

[project.optional-dependencies]
raw = ["rawpy>=0.19"]

[project.scripts]
raw-photo-culler = "raw_photo_culler.cli:main"

[project.urls]
Homepage = "https://github.com/AjaxFlare/raw-photo-culler"
Repository = "https://github.com/AjaxFlare/raw-photo-culler"
Issues = "https://github.com/AjaxFlare/raw-photo-culler/issues"

[tool.setuptools.packages.find]
where = ["src"]
